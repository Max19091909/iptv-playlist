name: Build IPTV

on:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * *'  # ежедневно в 03:17

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Если у тебя есть scripts/build.py — оставь эти два шага;
      # если нет или он пока пустой, можно временно удалить.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run build script (optional)
        run: |
          # Если скрипта нет, этот блок можно убрать.
          # Но в любом случае убедись, что папка ./public существует
          # и в ней лежат blink.m3u и full.m3u.
          mkdir -p public
          # Ниже — временная защита: если файлов нет, создадим тестовые.
          if [ ! -f "public/blink.m3u" ]; then
            echo "#EXTM3U" > public/blink.m3u
            echo "#EXTINF:-1,Blink Test" >> public/blink.m3u
            echo "http://example.com/stream" >> public/blink.m3u
          fi
          if [ ! -f "public/full.m3u" ]; then
            echo "#EXTM3U" > public/full.m3u
            echo "#EXTINF:-1,Full Test" >> public/full.m3u
            echo "http://example.com/stream2" >> public/full.m3u
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
